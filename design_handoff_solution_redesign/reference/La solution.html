<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>La solution — Uvibes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700&family=Roboto+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FD6E00;
      --rose: #D90A5C;
      --blueUvibes: #00AFDD;
      --cream: #f3ede3;
      --cream-2: #ebe3d4;
      --cream-3: #e2d7c1;
      --ink: #6a1340;        /* deep rose — used for primary text (no brown/black) */
      --ink-2: #94436c;      /* mid rose for body */
      --ink-3: #b87a98;      /* muted rose */
      --ink-4: #ccaab8;
      --rose-deep: #8a0a3f;
      --paper: #faf6ef;
      --warm-glow: linear-gradient(135deg, #FD6E00 0%, #ff4d7a 50%, #D90A5C 100%);
      --warm-glow-soft: linear-gradient(135deg, #ffc8a8 0%, #ffadc7 100%);
    }
    /* Responsive overrides */
    @media (max-width: 1024px) {
      main section { padding-left: 32px !important; padding-right: 32px !important; }
      [data-grid="2col"], [data-grid="3col"] { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 768px) {
      main section { padding-left: 20px !important; padding-right: 20px !important; padding-top: 60px !important; padding-bottom: 60px !important; }
      nav { padding-left: 16px !important; padding-right: 16px !important; }
      [data-grid="2col"], [data-grid="3col"], [data-grid="auto"] { grid-template-columns: 1fr !important; }
      [data-grid-rows="span"] { grid-row: auto !important; }
      [data-hide-mobile="true"] { display: none !important; }
      h1, h2 { letter-spacing: -0.03em !important; }
      .hide-mobile { display: none !important; }
      body { padding-bottom: 86px; } /* room for FloatingMenu */
    }
    @media (max-width: 480px) {
      main section { padding-left: 16px !important; padding-right: 16px !important; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; }
    .roboto-mono { font-family: 'Roboto Mono', monospace; }
    .prompt { font-family: 'Prompt', sans-serif; }
    .instrument { font-family: 'Instrument Serif', serif; }
    .prompt-display { font-family: 'Prompt', sans-serif; font-weight: 800; letter-spacing: -0.055em; }
    ::selection { background: var(--orange); color: var(--paper); }
    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; font-weight: 600; font-size: 14px; border: 0; cursor: pointer; transition: all 280ms cubic-bezier(.2,.7,.2,1); text-decoration: none; }
    .btn-brand { background: linear-gradient(90deg, var(--orange), var(--rose)); color: #fff; }
    .btn-brand:hover { filter: brightness(1.05); }
    .btn-glass { background: rgba(250,246,239,.7); color: var(--ink); border: 1.5px solid var(--rose); backdrop-filter: blur(8px); }
    .btn-glass:hover { background: rgba(217,10,92,.08); }
    .btn-gradient { background: linear-gradient(90deg, var(--orange), var(--rose)); color: #fff; box-shadow: 0 16px 40px -16px rgba(217,10,92,.5); }
    .btn-gradient:hover { transform: translateY(-1px); box-shadow: 0 18px 44px -14px rgba(217,10,92,.6); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="application/json" id="tweak-defaults">
  /*EDITMODE-BEGIN*/{
    "animation": "vibing",
    "jumpTo": "pour-qui",
    "activeTab": "pour-qui"
  }/*EDITMODE-END*/
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="home-extras.jsx"></script>
  <script type="text/babel" src="solution-sections.jsx"></script>
  <script type="text/babel" src="solution.jsx"></script>
</body>
</html>
