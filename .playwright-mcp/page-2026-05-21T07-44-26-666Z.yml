      - heading "La naissance de l'idée" [level=2] [ref=e26]
      - paragraph [ref=e27]:
        - text: Et si on se parlait vraiment ?
        - text: La plus longue étude menée par Harvard montre que la qualité de nos relations est le premier facteur de bonheur (Vaillant, 2002). Sur les réseaux sociaux traditionnels, les algorithmes nous relient à ceux qui pensent comme nous. Dans la vraie vie, on reste entre groupes familiers, on commente plus qu'on ne dialogue, et petit à petit... on perd la richesse de la diversité humaine.
        - text: "Chez Uvibes, nous croyons à :"
      - list [ref=e28]:
        - generic [ref=e29]:
          - img [ref=e30]
          - listitem [ref=e32]: La magie des témoignages
        - generic [ref=e33]:
