        - generic [ref=e37]:
          - img [ref=e38]
          - listitem [ref=e40]: Et à la richesse des visions nouvelles.
      - paragraph [ref=e41]:
        - text: Au sein d'une université, d'une entreprise, ou de tout autre collectif, beaucoup aimeraient échanger ainsi, mais n'osent pas.
        - text: Uvibes facilite ces rencontres inattendues, par un jeu de questions ouvertes et positives.
        - text: Parce que c'est en allant vers l'inconnu que naissent les plus belles conversations.
